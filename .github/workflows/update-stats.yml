# Ежедневное обновление счётчиков на сайте:
# скачивания R-пакетов с CRAN (cranlogs) и звёзды на GitHub.
# Пересобирает внутренние страницы (_build/build.py), обновляет assets/stats.json
# и коммитит изменения, после чего запрашивает пересборку GitHub Pages.

name: Update package stats

on:
  schedule:
    - cron: '0 6 * * *'   # каждый день в 06:00 UTC (09:00 по Киеву)
  workflow_dispatch:       # ручной запуск со вкладки Actions

permissions:
  contents: write
  pages: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild pages with fresh stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python _build/build.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json _build/data/package_stats.json opensource courses videos talks articles interviews
          if git diff --cached --quiet; then
            echo "Счётчики не изменились"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Обновление счётчиков пакетов $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages соберутся по пушу"
